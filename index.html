<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <div class="card">

            <h1>Do you love me?</h1>

            <div class="character">
                <div class="flower">✿</div>

                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="blush left-blush"></div>
                    <div class="blush right-blush"></div>
                    <div class="mouth">ᴗ</div>
                </div>

                <div class="body">
                    <div class="heart">♥</div>
                </div>

                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>
            </div>

            <div class="buttons">
                <button id="yesBtn" class="yes-btn">Yes</button>
                <button id="noBtn" class="no-btn">Are you sure?</button>
            </div>

            <p id="message"></p>

        </div>
    </main>


    <!-- FINAL SCREEN -->
    <section id="finalScreen" class="final-screen">

        <div class="final-content">

            <h2>
                I knew it! <span class="top-heart">♥</span>
            </h2>

            <div class="final-character">

                <div class="final-flower">✿</div>

                <div class="final-head">
                    <div class="final-eye final-eye-left"></div>
                    <div class="final-eye final-eye-right"></div>

                    <div class="final-blush final-blush-left"></div>
                    <div class="final-blush final-blush-right"></div>

                    <div class="final-mouth">ᴗ</div>
                </div>

                <div class="final-body">
                    <div class="final-heart">♥</div>
                </div>

                <div class="final-arm final-arm-left"></div>
                <div class="final-arm final-arm-right"></div>

            </div>

            <div class="anniversary">
                HAPPY 4TH MONTHSARRY BAMM!!
                <span class="anniversary-heart">♥</span>
            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
